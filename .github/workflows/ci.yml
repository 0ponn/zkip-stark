name: CI

# This workflow is deliberately split into two jobs.
#
# `build` gates what currently compiles. It must stay green.
#
# `full-build` compiles EVERY target, including the modules excluded from the
# default target. It is expected to be RED until REMEDIATION.md (R6) is closed.
# That red is the point: the previous workflow reported success while never
# building seven of the thirteen modules, which is how the project came to
# advertise itself as production ready while most of it did not compile.
#
# Do not add `continue-on-error` to either job. If something here is failing,
# either fix it or record it in REMEDIATION.md — do not silence it.

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build (default target)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Verify Lean version
      run: |
        elan --version
        lean --version

    - name: Build default target
      run: lake build

    - name: Build Main executable
      run: lake build Main

    - name: Check for build artifacts
      run: |
        test -f .lake/build/bin/Main
        echo "✓ Main executable built"

    - name: Build and run API tests
      run: |
        lake build Tests.ApiTests
        lake exe Tests.ApiTests

  full-build:
    name: Build (all targets — see REMEDIATION.md R6)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    # `lake build` only builds the default target, which covers six modules.
    # Naming every module forces the rest to compile too.
    - name: Build all library modules
      run: |
        lake build \
          ZkIpProtocol \
          ZkIpProtocol.STARKIntegration \
          ZkIpProtocol.Batching \
          ZkIpProtocol.RecursiveProofs \
          ZkIpProtocol.FullRecursiveVerification \
          ZkIpProtocol.HashConstraints \
          ZkIpProtocol.FRIVerification \
          ZkIpProtocol.MerkleReconstruction \
          ZkIpProtocol.ZKMB \
          ZkIpProtocol.Performance \
          ZkIpProtocol.StringMatchOptimization \
          ZkIpProtocol.AIOptimization \
          ZkIpProtocol.IrohIntegration \
          ZkIpProtocol.Api

    - name: Build all test targets
      run: |
        lake build \
          Tests.ProtocolTests \
          Tests.STARKTests \
          Tests.BatchingTests \
          Tests.ZKMBTests \
          Tests.ApiTests \
          Tests.Validation.MasterValidation \
          Tests.Validation.SoundnessTests \
          Tests.Validation.STARKRoundTripTests \
          Tests.Validation.ThroughputBenchmarks \
          Tests.Validation.ZKMBLatencyTests \
          Tests.Validation.RecursiveStabilityTests

  claims-audit:
    name: Claims audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The old workflow grepped for `sorry` and reported "no incomplete proofs".
    # That check is vacuous here: the repository contains no theorems, so there
    # is nothing to leave incomplete. It read as evidence of formal verification
    # and was not. This replaces it with a check that actually means something.
    - name: Report proof and circuit status
      run: |
        THEOREMS=$(grep -rc "^\s*\(theorem\|lemma\)\b" --include=*.lean . 2>/dev/null \
          | awk -F: '{s+=$2} END {print s+0}')
        echo "theorem/lemma declarations: $THEOREMS"
        echo ""
        echo "Circuit bodies (each should eventually express real constraints):"
        grep -rn "Aiur.Term.ret" ZkIpProtocol/ || true
        echo ""
        if [ "$THEOREMS" -eq 0 ]; then
          echo "::warning::No theorems in this repository. Do not describe it as 'formally verified'. See REMEDIATION.md (R8)."
        fi

    # Guard against the withdrawn performance numbers and status claims
    # reappearing in documentation. See REMEDIATION.md (R7, R9).
    - name: Block withdrawn claims in docs
      run: |
        set +e
        PATTERN='production.ready|formally verified|sub-3ms|300-500 proofs'
        HITS=$(grep -rniE "$PATTERN" --include=*.md . \
          | grep -viE 'REMEDIATION.md|not |never |withdrawn|NOT |do not|❌|previously|former')
        set -e
        if [ -n "$HITS" ]; then
          echo "$HITS"
          echo ""
          echo "::error::Withdrawn claim reintroduced. These claims were removed because they are false; see REMEDIATION.md."
          exit 1
        fi
        echo "✓ No withdrawn claims found"
