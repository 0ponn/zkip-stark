name: API Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl jq

    - name: Build project
      run: |
        lake build Main
      continue-on-error: false

    - name: Make scripts executable
      run: |
        chmod +x test_all.sh || true

    - name: Start service in background
      env:
        ZKIP_API_KEY: ci-test-key-0123456789abcdef
      run: |
        # One long-running process; it builds the circuit before listening.
        scripts/serve.sh 8080 > /tmp/service.log 2>&1 &
        echo $! > /tmp/service.pid
        for i in $(seq 1 120); do
          if curl -s -o /dev/null http://localhost:8080/health; then
            echo "✓ Service listening after ${i}s"
            exit 0
          fi
          if ! kill -0 "$(cat /tmp/service.pid)" 2>/dev/null; then
            echo "Service exited. Log:"; cat /tmp/service.log; exit 1
          fi
          sleep 1
        done
        echo "Service did not start listening. Log:"; cat /tmp/service.log; exit 1

    - name: Run API tests
      run: |
        # Any failed test, or a run that does not finish in time, fails the
        # job. (The old step read the pipeline status from tee and parsed the
        # failure count out of ANSI-colored text, so failures passed.)
        set -o pipefail
        CI=true ZKIP_API_KEY=ci-test-key-0123456789abcdef timeout 300 ./test_all.sh 8080 2>&1 | tee /tmp/test_output.log

    - name: Verify in a fresh process
      env:
        ZKIP_API_KEY: ci-test-key-0123456789abcdef
      run: scripts/cross_process_check.sh 8081

    - name: Cleanup
      if: always()
      run: |
        if [ -f /tmp/service.pid ]; then
          PID=$(cat /tmp/service.pid)
          if ps -p $PID > /dev/null 2>&1; then
            kill $PID 2>/dev/null || true
          fi
        fi
        pkill -f ".lake/build/bin/Main" || true

